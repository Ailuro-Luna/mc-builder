name: Offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create isolated local configuration
        run: cp config.example.json config.json
      - name: Check public files and history
        run: python scripts/check_publication.py --history HEAD
      - name: Run offline unit tests
        run: python -m unittest discover -v
